name: Milestone 3 verification

on:
  push:
    branches:
      - codex/milestone-3-safety-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run format:check
      - run: npm run schema:check
      - run: npm run build
      - run: npm run check:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Create and verify Milestone 3 bundle
        run: |
          git branch -f codex/milestone-3-safety-review HEAD
          git bundle create jade-hypno-studio-m3.bundle codex/milestone-3-safety-review
          git bundle verify jade-hypno-studio-m3.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: jade-hypno-studio-m3-bundle
          path: jade-hypno-studio-m3.bundle
          if-no-files-found: error
