name: Milestone 3 verification

on:
  push:
    branches:
      - codex/milestone-3-safety-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize Milestone 3 formatting
        run: |
          npx prettier --write docs/architecture.md src/App.m3.test.tsx src/App.tsx src/components/GroundingMode.tsx src/components/SessionReview.test.tsx src/components/SessionReview.tsx src/domain/safetyReviewSchema.test.ts src/safety/returnNow.test.ts src/safety/returnNow.ts src/safety/reviewEngine.test.ts src/safety/reviewEngine.ts src/safety/rules.ts src/styles.css
          if ! git diff --quiet; then
            git config user.name "jade-hypno-studio-ci"
            git config user.email "actions@users.noreply.github.com"
            git add docs/architecture.md src/App.m3.test.tsx src/App.tsx src/components/GroundingMode.tsx src/components/SessionReview.test.tsx src/components/SessionReview.tsx src/domain/safetyReviewSchema.test.ts src/safety/returnNow.test.ts src/safety/returnNow.ts src/safety/reviewEngine.test.ts src/safety/reviewEngine.ts src/safety/rules.ts src/styles.css
            git commit -m "Format Milestone 3 implementation"
            git push origin HEAD:codex/milestone-3-safety-review
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run schema:check
      - run: npm run check:dist
      - run: npm run test:native
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
