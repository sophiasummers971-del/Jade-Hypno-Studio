name: Milestone 3 verification

on:
  push:
    branches:
      - codex/milestone-3-safety-review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh generated schemas
        run: |
          npm run schema:generate
          if ! git diff --quiet -- src-tauri/schemas; then
            git config user.name "jade-hypno-studio-ci"
            git config user.email "actions@users.noreply.github.com"
            git add src-tauri/schemas
            git commit -m "Regenerate schemas for Milestone 3"
            git push origin HEAD:codex/milestone-3-safety-review
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run schema:check
      - run: npm run check:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
